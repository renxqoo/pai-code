# 冒烟包配置（T9 §未决项 Spike 1：未签名 mac 包）。签名/公证/codesign、三平台
# bun 锁定修订、哈希清单与 license 审计属 T9 M6，此处不实现。
appId: app.x3code.app
productName: X3code
# @electron/get 每次构建都绕过缓存重新下载 SHASUMS256.txt（源码标定 cacheMode:
# Bypass），GitHub 不可达时 packaging 阶段会挂在 TCP 连接上直到 ECONNREFUSED。
# 钉死官方校验和后走本地生成的校验文件，打包不再依赖网络；zip 本体仍用
# @electron/get 缓存（bun install 的 electron postinstall 填充）。
# force: false 仅作 ElectronGetOptions 形状判别（无强制重下语义）；升 electron
# 版本或新增打包目标 arch 时需同步补对应条目，不匹配会校验失败显式报错。
electronDownload:
  force: false
  checksums:
    electron-v44.7.0-darwin-arm64.zip: e04e411b58a0a14375dd21b0ab4a378fd38930a702e4e20e322fee4849404c0b
directories:
  output: release
files:
  # 运行时零 node_modules 依赖：全部经 electron-vite 打进 out/（主进程仅外部化
  # node 内建与 electron），包内只装载荷；依赖全在 devDependencies，
  # electron-builder 不会装配任何 node_modules
  - out/**
extraResources:
  # 仓库根 resources/（bun/bun + host-hub/host-hub）由 scripts/packaging/sync-resources.ts 填充
  - from: ../../resources
    to: .
mac:
  identity: null
  icon: build/icon.icns
  target:
    - target: dir
    - target: dmg
